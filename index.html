    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const notifyForm = document.getElementById('notifyForm');
        const notifyBtn  = document.getElementById('notifyBtn');
        const statusMsg  = document.getElementById('statusMsg');
        const notifyEmail = document.getElementById('notifyEmail');

        notifyForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = notifyEmail.value.trim();
            if (!email) return;

            notifyBtn.disabled = true;
            const originalText = notifyBtn.textContent;
            notifyBtn.textContent = 'Subscribing…';
            statusMsg.className = 'status-msg';
            statusMsg.textContent = '';

            try {
                const res = await fetch('api/coming-soon/notify.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (data.success) {
                    statusMsg.className = 'status-msg ok';
                    statusMsg.textContent = 'You are on the list. We will be in touch.';
                    notifyEmail.value = '';
                    notifyBtn.textContent = 'Subscribed';
                } else {
                    throw new Error(data.message || 'Something went wrong.');
                }
            } catch (err) {
                statusMsg.className = 'status-msg err';
                statusMsg.textContent = err.message || 'Could not subscribe. Please try again.';
                notifyBtn.disabled = false;
                notifyBtn.textContent = originalText;
            }
        });
    </script>
