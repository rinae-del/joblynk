<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Preferences | JobLynk</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg:#0F172A; --surface:#1E293B; --border:rgba(148,163,184,0.18); --text:#F1F5F9; --muted:#94A3B8; --accent:#6366F1; --accent-light:#818CF8; --green:#34D399; }
        body { font-family:'Plus Jakarta Sans',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:2rem 1.25rem; }
        .np-wrap { max-width:640px; margin:2rem auto; }
        .np-head { display:flex; align-items:center; gap:0.7rem; margin-bottom:0.4rem; }
        .np-logo { height:30px; width:auto; }
        h1 { font-size:1.6rem; font-weight:800; letter-spacing:-0.02em; margin-bottom:0.4rem; }
        .np-sub { color:var(--muted); font-size:0.95rem; line-height:1.6; margin-bottom:2rem; }
        .np-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
        .np-row { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1.15rem 1.35rem; border-bottom:1px solid var(--border); }
        .np-row:last-child { border-bottom:none; }
        .np-row-text h3 { font-size:1rem; font-weight:700; margin-bottom:0.15rem; }
        .np-row-text p { font-size:0.85rem; color:var(--muted); line-height:1.5; }
        .np-locked { font-size:0.75rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.06em; }
        .switch { position:relative; width:48px; height:28px; flex-shrink:0; }
        .switch input { opacity:0; width:0; height:0; }
        .slider { position:absolute; inset:0; background:rgba(148,163,184,0.3); border-radius:999px; cursor:pointer; transition:background 0.2s ease; }
        .slider::before { content:""; position:absolute; height:20px; width:20px; left:4px; top:4px; background:#fff; border-radius:50%; transition:transform 0.2s ease; }
        .switch input:checked + .slider { background:var(--accent); }
        .switch input:checked + .slider::before { transform:translateX(20px); }
        .switch input:disabled + .slider { opacity:0.5; cursor:not-allowed; }
        .np-note { margin-top:1.5rem; font-size:0.82rem; color:var(--muted); text-align:center; line-height:1.6; }
        .np-back { display:inline-block; margin-top:1.25rem; color:var(--accent-light); text-decoration:none; font-weight:600; font-size:0.9rem; }
        .np-toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface); border:1px solid var(--border); color:var(--text); padding:0.7rem 1.2rem; border-radius:10px; font-size:0.88rem; font-weight:600; opacity:0; transition:all 0.25s ease; pointer-events:none; }
        .np-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .np-loading { color:var(--muted); text-align:center; padding:2rem; }
    </style>
</head>
<body>
    <div class="np-wrap">
        <div class="np-head">
            <img src="images/logo.png" alt="" class="np-logo">
        </div>
        <h1>Email preferences</h1>
        <p class="np-sub">Choose which emails you'd like to receive from JobLynk. Account and security emails are always sent.</p>

        <div class="np-card" id="prefsCard">
            <div class="np-loading" id="prefsLoading">Loading your preferences…</div>
        </div>

        <p class="np-note">Changes are saved automatically. You can also unsubscribe from any email using the link at the bottom of it.</p>
        <a href="dashboard.html" class="np-back">← Back to dashboard</a>
    </div>

    <div class="np-toast" id="toast"></div>

    <script src="auth-guard.js"></script>
    <script>
    (function () {
        var card = document.getElementById('prefsCard');
        var toastEl = document.getElementById('toast');
        var toastTimer = null;
        function toast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
        }

        function render(prefs) {
            card.innerHTML = '';
            Object.keys(prefs).forEach(function (key) {
                var p = prefs[key];
                var row = document.createElement('div');
                row.className = 'np-row';
                var desc = {
                    account: 'Sign-in, verification, password and payment emails.',
                    application_updates: 'When a recruiter views your application or changes its status.',
                    reminders: 'Nudges when an application has had no response for a while.',
                    recommendations: 'New jobs matched to your profile and recent applications.',
                    marketing: 'Occasional product news and announcements.'
                }[key] || '';
                var control = p.optional
                    ? '<label class="switch"><input type="checkbox" data-cat="' + key + '"' + (p.enabled ? ' checked' : '') + '><span class="slider"></span></label>'
                    : '<span class="np-locked">Always on</span>';
                row.innerHTML = '<div class="np-row-text"><h3>' + p.label + '</h3><p>' + desc + '</p></div>' + control;
                card.appendChild(row);
            });
            card.querySelectorAll('input[data-cat]').forEach(function (input) {
                input.addEventListener('change', function () { save(input.dataset.cat, input.checked, input); });
            });
        }

        function save(category, enabled, input) {
            input.disabled = true;
            fetch('api/notifications/preferences.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ category: category, enabled: enabled })
            }).then(function (r) { return r.json(); }).then(function (data) {
                input.disabled = false;
                if (data && data.success) { toast(enabled ? 'Subscribed' : 'Unsubscribed'); }
                else { input.checked = !enabled; toast('Could not save — try again'); }
            }).catch(function () { input.disabled = false; input.checked = !enabled; toast('Could not save — try again'); });
        }

        fetch('api/notifications/preferences.php', { credentials: 'include' })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (data && data.success && data.preferences) render(data.preferences);
                else card.innerHTML = '<div class="np-loading">Could not load preferences. Please sign in and try again.</div>';
            })
            .catch(function () { card.innerHTML = '<div class="np-loading">Could not load preferences.</div>'; });
    })();
    </script>
</body>
</html>
