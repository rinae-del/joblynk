<body>
    <div class="ambient" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>
    <div class="noise" aria-hidden="true"></div>

    <main class="stage">
        <div class="brand">Job<span>Lynk</span>.</div>

        <div class="glass-card">
            <h1>Staff Portal</h1>
            <p>Enter the team passphrase to unlock preview access.</p>
            <form class="pass-form" id="staffForm">
                <input type="password" id="passphrase" placeholder="Enter passphrase" required autocomplete="off" autofocus>
                <button type="submit" id="submitBtn">Unlock Preview</button>
            </form>
            <div class="status-msg" id="statusMsg"></div>
        </div>

        <div class="back-link">
            <a href="index.html">&larr; Back to Coming Soon</a>
        </div>
    </main>

    <script>
        const form = document.getElementById('staffForm');
        const btn  = document.getElementById('submitBtn');
        const status = document.getElementById('statusMsg');
        const input  = document.getElementById('passphrase');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const passphrase = input.value.trim();
            if (!passphrase) return;

            btn.disabled = true;
            btn.textContent = 'Verifying…';
            status.className = 'status-msg';
            status.textContent = '';

            try {
                const res = await fetch('api/auth/staff-login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ passphrase })
                });
                const data = await res.json();
                if (data.success) {
                    status.className = 'status-msg ok';
                    status.textContent = 'Access granted. Redirecting…';
                    window.location.href = 'jobs.html';
                } else {
                    throw new Error(data.message || 'Access denied.');
                }
            } catch (err) {
                status.className = 'status-msg err';
                status.textContent = err.message || 'Could not verify. Try again.';
                btn.disabled = false;
                btn.textContent = 'Unlock Preview';
            }
        });
    </script>
</body>
</html>
