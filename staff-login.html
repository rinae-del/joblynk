<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal | JobLynk</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #FFFFFF;
            --text: #0F172A;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --border-focus: #CBD5E1;
            --accent: #1E3A5F;
            --accent-hover: #152A45;
            --error: #DC2626;
            --success: #15803D;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 0 1.5rem;
            width: 100%;
        }

        /* ── Header ── */
        .site-header {
            padding: 2rem 0;
        }

        .logo {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1.125rem;
            letter-spacing: -0.02em;
            color: var(--text);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-mark {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* ── Main ── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem 0 6rem;
        }

        .headline {
            font-family: 'DM Serif Display', Georgia, serif;
            font-size: clamp(1.75rem, 4vw, 2.25rem);
            line-height: 1.25;
            letter-spacing: -0.01em;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .subhead {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
        }

        /* ── Form ── */
        .pass-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .pass-form input[type="password"] {
            padding: 0.875rem 1rem;
            font-size: 0.9375rem;
            font-family: inherit;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .pass-form input[type="password"]::placeholder {
            color: var(--text-muted);
        }

        .pass-form input[type="password"]:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.08);
        }

        .pass-form button {
            padding: 0.875rem 1.25rem;
            font-size: 0.9375rem;
            font-weight: 500;
            font-family: inherit;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .pass-form button:hover {
            background: var(--accent-hover);
        }

        .pass-form button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 0.75rem;
            font-size: 0.875rem;
            min-height: 1.4em;
        }

        .status-msg.ok { color: var(--success); }
        .status-msg.err { color: var(--error); }

        /* ── Back link ── */
        .back-link {
            margin-top: 2rem;
        }

        .back-link a {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .back-link a:hover {
            color: var(--text);
        }

        /* ── Footer ── */
        .site-footer {
            padding: 1.5rem 0;
            border-top: 1px solid var(--border);
        }

        .footer-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-copy {
            font-size: 0.8125rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-mark">JL</span>
                JobLynk
            </a>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <h1 class="headline">Staff Portal</h1>
            <p class="subhead">Enter the team passphrase to unlock preview access.</p>

            <form class="pass-form" id="staffForm">
                <input type="password" id="passphrase" placeholder="Enter passphrase" required autocomplete="off" autofocus>
                <button type="submit" id="submitBtn">Unlock Preview</button>
            </form>

            <div class="status-msg" id="statusMsg"></div>

            <div class="back-link">
                <a href="index.html">&larr; Back to Coming Soon</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-inner">
                <span class="footer-copy">&copy; <span id="year"></span> JobLynk</span>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const form = document.getElementById('staffForm');
        const btn  = document.getElementById('submitBtn');
        const status = document.getElementById('statusMsg');
        const input  = document.getElementById('passphrase');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const passphrase = input.value.trim();
            if (!passphrase) return;

            btn.disabled = true;
            const originalText = btn.textContent;
            btn.textContent = 'Verifying…';
            status.className = 'status-msg';
            status.textContent = '';

            try {
                const res = await fetch('api/auth/staff-login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ passphrase })
                });
                const data = await res.json();
                if (data.success) {
                    status.className = 'status-msg ok';
                    status.textContent = 'Access granted. Redirecting…';
                    window.location.href = 'jobs.html';
                } else {
                    throw new Error(data.message || 'Access denied.');
                }
            } catch (err) {
                status.className = 'status-msg err';
                status.textContent = err.message || 'Could not verify. Try again.';
                btn.disabled = false;
                btn.textContent = originalText;
            }
        });
    </script>

</body>
</html>
